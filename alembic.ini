# Alembic config. Run all commands from this folder (the one with `app/`).
[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is NOT set here. alembic/env.py takes it from app/database.py,
# so migrations always run against the same database the app uses
# (SQLite locally, PostgreSQL when ENVIRONMENT=production).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
